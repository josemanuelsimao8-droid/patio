<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Administração Pátio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-login-page">
  <main class="login-shell">
    <a class="login-brand" href="/" aria-label="Pátio Luanda, voltar ao site">
      <img src="/assets/logo-white.png" alt="Pátio Luanda" width="184" height="58">
    </a>
    <p class="eyebrow">Área reservada</p>
    <h1>Entrar na administração</h1>
    <p class="login-intro">Gestão do conteúdo e das páginas do site.</p>
    {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
      <label for="password">Palavra-passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary-button" type="submit">Entrar</button>
    </form>
    <a class="back-link" href="/">Voltar ao site</a>
  </main>
</body>
</html>
